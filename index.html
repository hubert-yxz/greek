<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Griechisch lernen</title>
<style>
:root{--bg:#eef3f7;--surf:#fff;--ink:#12263a;--mute:#5d7184;--acc:#1b5fa8;--acc2:#e8f0f9;--ok:#2f7d4f;--bad:#b3402f;--line:#cfdbe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--surf:#162636;--ink:#e6eef6;--mute:#90a5b8;--acc:#6aaef0;--acc2:#1d3249;--ok:#6cc58d;--bad:#ef8b7a;--line:#2a4056;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a26;--surf:#162636;--ink:#e6eef6;--mute:#90a5b8;--acc:#6aaef0;--acc2:#1d3249;--ok:#6cc58d;--bad:#ef8b7a;--line:#2a4056;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Serif","Georgia",serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 14px;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--surf);border-radius:10px;font-weight:600}
.tab[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card .t{flex:1}
.gr{font-size:1.35rem;font-weight:700}
.tr{color:var(--mute);font-size:.9rem;font-style:italic}
.de{font-size:1rem}
.ph{color:var(--acc);font-size:1rem}
.play{width:46px;height:46px;border-radius:50%;border:none;background:var(--acc2);color:var(--acc);font-size:1.2rem;flex:none}
.play:active{transform:scale(.94)}
.note{background:var(--acc2);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px;display:none}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border:1px solid var(--line);background:var(--surf);border-radius:10px;font-size:.9rem}
.seg button[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:600}
.q{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;margin-bottom:12px}
.q .gr{font-size:2rem}
.meta{color:var(--mute);font-size:.85rem;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;border:1px solid var(--line);background:var(--surf);border-radius:10px;font-size:1.05rem}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surf))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--surf))}
.opt[disabled]{cursor:default}
.primary{width:100%;padding:14px;border:none;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:1rem}
.res{text-align:center;padding:20px}
.res .big{font-size:2.6rem;font-weight:700;color:var(--acc)}
[hidden]{display:none!important}
body.run{background:#000}
body.run .tabs,body.run details,body.run #lesson{display:none}
body.run #lstop{background:#1a1a1a!important;color:#9a9a9a!important;border:1px solid #333!important}
</style>
</head>
<body>
<main>
<div class="meta" id="goal" style="margin-bottom:4px"></div>
<div id="goalwrap" style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px"><div id="goalbar" style="height:100%;background:var(--acc)"></div></div>
<select id="lesson" aria-label="Lektion" style="width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);font:inherit;font-weight:600">
  <option value="0">Lektion 1: Grundwörter</option>
  <option value="1">Lektion 2: Unterwegs und am Tisch</option>
  <option value="2">Lektion 3: Farben, Tage und Wichtiges</option>
  <option value="3">Lektion 4: Zahlen und erste Verben</option>
  <option value="4">Lektion 5: Personen, Orte, Richtungen</option>
  <option value="5">Lektion 6: Essen und Trinken</option>
  <option value="6">Lektion 7: Einkaufen und Kleidung</option>
  <option value="7">Lektion 8: Familie, Körper, Gesundheit</option>
  <option value="all">Alle Lektionen gemischt</option>
</select>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t1" aria-selected="true">Wörter</button>
  <button class="tab" role="tab" id="t2" aria-selected="false">Quiz</button>
  <button class="tab" role="tab" id="t3" aria-selected="false">Hören</button>
</div>
<details style="margin-bottom:12px"><summary style="cursor:pointer;color:var(--acc);font-weight:600">Stimme und Tempo einstellen</summary>
<div style="display:flex;gap:8px;margin-top:8px">
<select id="voiceSel" aria-label="Stimme" style="flex:2;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);font:inherit"></select>
<select id="rateSel" aria-label="Tempo" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);font:inherit"><option value="0.6">langsam</option><option value="0.8">ruhig</option><option value="1" selected>normal</option></select>
</div></details>
<div class="note" id="note">Auf diesem Gerät ist keine griechische Stimme installiert. Die Aussprache kann deshalb abweichen. Eine Stimme lässt sich in den Systemeinstellungen unter Sprache oder Bedienungshilfen nachladen.</div>

<section id="learn"></section>

<section id="listen" hidden>
  <div id="lsetup">
    <div class="meta">Alle Wörter, zufällige Reihenfolge, 2 Sekunden Pause</div>
    <label style="display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:.95rem"><input type="checkbox" id="loopChk"> Nach dem letzten Wort von vorn beginnen</label>
    <label style="display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:.95rem"><input type="checkbox" id="screenChk" checked> Display anlassen (Helligkeit niedrig stellen spart Akku)</label>
    <button class="primary" id="lgd" style="height:28vh;min-height:130px;font-size:1.3rem;margin-bottom:12px">Griechisch → Deutsch</button>
    <button class="primary" id="ldg" style="height:28vh;min-height:130px;font-size:1.3rem">Deutsch → Griechisch</button>
  </div>
  <div id="lrunbox" hidden>
    <div id="lstat" style="color:#7a7a7a;font-size:.85rem;margin-bottom:10px;min-height:2.6em"></div>
    <button class="primary" id="lstop" style="height:62vh;min-height:260px;font-size:1.6rem;background:var(--bad)">Stopp</button>
  </div>
</section>
<section id="quiz" hidden>
  <div id="setup">
    <div class="meta">Quiz-Art</div>
    <div class="seg" id="modeSeg">
      <button data-m="hear" aria-pressed="true">Hören → Deutsch</button>
      <button data-m="read" aria-pressed="false">Deutsch → Griechisch</button>
    </div>
    <button class="primary" id="start">Quiz starten</button>
  </div>
  <div id="play" hidden>
    <div class="meta" id="prog"></div>
    <div class="q" id="qbox"></div>
    <div id="opts"></div>
    <button class="primary" id="next" hidden>Weiter</button>
  </div>
  <div id="end" class="res" hidden>
    <div class="big" id="score"></div>
    <p id="msg"></p>
    <button class="primary" id="again">Nochmal</button>
  </div>
</section>
</main>

function start(){
  qs=shuffle(W);total=qs.length;seen=new Set();rc=new Map();usedWrong=new Map();qi=0;score=0;
  $('#setup').hidden=true;$('#end').hidden=true;$('#play').hidden=false;ask();

function ask(){
  answered=false;const w=qs[qi];isRepeat=seen.has(w);seen.add(w);rk=isRepeat?(rc.get(w)||0)+1:0;
  $('#prog').textContent=`Frage ${qi+1} von ${qs.length} · Gleich richtig: ${score}`;
  const box=$('#qbox');
  const badge=isRepeat?`<div style="display:inline-block;background:var(--acc2);color:var(--acc);border-radius:20px;padding:3px 12px;font-size:.85rem;font-weight:600;margin-bottom:10px">Wiederholung ${rk} von 3</div><br>`:'';
  box.innerHTML=badge+(mode==='hear'
    ?`<button class="play" id="rep" aria-label="Nochmal anhören" style="width:64px;height:64px;font-size:1.6rem">▶</button><div class="tr" style="margin-top:8px">Was bedeutet das Wort?</div>`
    :`<div class="tr">Wie heißt das auf Griechisch?</div><div class="gr" style="font-family:inherit;font-size:1.7rem">${w[2]}</div>`);
  if(mode==='hear'){$('#rep').onclick=()=>say(w[0]);setTimeout(()=>say(w[0]),250);}
  const pool=W.length>=4?W:ALL;
  const used=usedWrong.get(w)||new Set();
  const cand=shuffle(pool.filter(x=>x!==w&&x[2]!==w[2]));
  let others=cand.filter(x=>!used.has(x)).slice(0,3);
  if(others.length<3)others=others.concat(cand.filter(x=>!others.includes(x)).slice(0,3-others.length));
  if(others.length<3)others=others.concat(shuffle(ALL.filter(x=>x!==w&&x[2]!==w[2]&&!others.includes(x))).slice(0,3-others.length));
  others.forEach(x=>used.add(x));usedWrong.set(w,used);
  const opts=shuffle([w,...others]);
  const o=$('#opts');o.innerHTML='';
  opts.forEach(x=>{
    const b=document.createElement('button');b.className='opt';
    b.textContent=mode==='hear'?x[2]:`${x[0]}  (${x[1]})`;
    b.onclick=()=>pick(b,x===w,w);o.appendChild(b);
  });
  $('#next').hidden=true;
}
function scheduleRepeats(w){
  rc.set(w,0);
  for(let i=qs.length-1;i>qi;i--)if(qs[i]===w)qs.splice(i,1);
  let pos=qi;
  for(let n=0;n<3;n++){pos+=3+Math.floor(Math.random()*5);qs.splice(Math.min(pos,qs.length),0,w);}
}

function pick(b,right,w){

  if(right){b.classList.add('ok');if(!isRepeat)score++;else rc.set(w,rk);}
  else{
    if(b)b.classList.add('bad');scheduleRepeats(w);
  }
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;
    if(mode==='hear'?x.textContent===w[2]:x.textContent.startsWith(w[0]))x.classList.add('ok');});
  if(mode==='read')say(w[0]);

}

function releaseAwake(){try{if(keepV)keepV.pause();if(keepA)keepA.pause();}catch(e){}}
document.addEventListener('visibilitychange',async()=>{
  if(!document.hidden&&lrun&&$('#lrunbox')&&!$('#lrunbox').hidden){
    if($('#screenChk').checked&&!lwake)await getWake();
  }
});

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function speakP(text,lang,vo){return new Promise(res=>{
  let t;const fin=()=>{clearTimeout(t);res();};
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang=lang;if(vo)u.voice=vo;u.rate=rate;
    u.onend=fin;u.onerror=fin;t=setTimeout(fin,6000+text.length*200);
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){fin();}
});}
async function getWake(){
  const st=$('#lstat');
  if(!navigator.wakeLock){st.textContent='Display-Sperre in dieser Ansicht nicht möglich. Stelle unter Einstellungen → Display die Ausschaltzeit auf 30 Minuten.';return;}
  try{
    lwake=await navigator.wakeLock.request('screen');
    lwake.addEventListener('release',()=>{lwake=null;});
    st.textContent='Display-Sperre aktiv.';
  }catch(e){st.textContent='Display-Sperre wurde abgelehnt ('+(e&&e.name||'Fehler')+'). Stelle unter Einstellungen → Display die Ausschaltzeit auf 30 Minuten.';}
}
async function listenRun(dir){
  const tok=++lrun;
  $('#lsetup').hidden=true;$('#lrunbox').hidden=false;document.body.classList.add('run');
  keepAwake();
  $('#lstat').textContent='';
  if($('#screenChk').checked)await getWake();
  pickVoice();
  let pass=0;
  while(tok===lrun){
    pass++;
    for(const w of shuffle(ALL)){
      if(tok!==lrun)return;
      if(dir==='gd'){
        await speakP(w[0],'el-GR',voice);if(tok!==lrun)return;
        await sleep(2000);if(tok!==lrun)return;
        await speakP(w[2],'de-DE',deVoice);
      }else{
        await speakP(w[2],'de-DE',deVoice);if(tok!==lrun)return;
        await sleep(2000);if(tok!==lrun)return;
        await speakP(w[0],'el-GR',voice);
      }
      if(tok!==lrun)return;
      await sleep(2000);
    }
    if(tok!==lrun)return;
    if(!$('#loopChk').checked){
      await speakP('Durchgang beendet. Alle '+ALL.length+' Wörter.','de-DE',deVoice);
      if(tok===lrun)stopListen();
      return;
    }
  }
}
function stopListen(){
  lrun++;try{speechSynthesis.cancel();}catch(e){}
  try{if(lwake){lwake.release();lwake=null;}}catch(e){}
  releaseAwake();
  $('#lsetup').hidden=false;$('#lrunbox').hidden=true;document.body.classList.remove('run');
}
$('#lgd').onclick=()=>listenRun('gd');
$('#ldg').onclick=()=>listenRun('dg');
$('#lstop').onclick=stopListen;
